<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Notes | MYDIARY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Space Background -->
    <div class="space-bg">
        <div class="stars"></div>
        <div class="stars stars-two"></div>
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
    </div>


    <main class="create-page">

        <!-- Back -->

        <button
            class="back-btn"
            onclick="window.location.href='home.html'"
        >
            ← Back
        </button>


        <!-- Header -->

        <div class="saved-page-header">

            <div class="create-page-icon">
                📝
            </div>

            <div>

                <h1>Your Notes</h1>

                <p>
                    Everything you've written in one place.
                </p>

            </div>

        </div>


        <!-- Notes appear here -->

        <div
            id="allNotesContainer"
            class="notes-container"
        >

            <p class="loading-text">
                Loading your notes...
            </p>

        </div>

>

    </main>


    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
